<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101827" />
      <stop offset="100%" stop-color="#172338" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  
  <!-- Header Bar -->
  <rect x="30" y="25" width="740" height="50" rx="8" fill="#1e293b" stroke="#283955" stroke-width="1"/>
  <circle cx="55" cy="50" r="6" fill="#10b981"/>
  <text x="75" y="55" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Supply Chain &amp; Logistics Network Optimization Model</text>
  <rect x="625" y="37" width="125" height="26" rx="4" fill="#10b981" opacity="0.2"/>
  <text x="687" y="54" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">LEAD TIME: -18%</text>

  <!-- Metric Cards -->
  <rect x="30" y="90" width="230" height="75" rx="8" fill="#1a263c" stroke="#283955" stroke-width="1"/>
  <text x="50" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">OTIF (ON-TIME IN-FULL)</text>
  <text x="50" y="142" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="700">97.8%</text>

  <rect x="285" y="90" width="230" height="75" rx="8" fill="#1a263c" stroke="#283955" stroke-width="1"/>
  <text x="305" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">AVERAGE ORDER LEAD TIME</text>
  <text x="305" y="142" fill="#75B8FF" font-family="'Inter', sans-serif" font-size="20" font-weight="700">2.1 Days</text>

  <rect x="540" y="90" width="230" height="75" rx="8" fill="#1a263c" stroke="#283955" stroke-width="1"/>
  <text x="560" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">FLEET CAPACITY UTILIZATION</text>
  <text x="560" y="142" fill="#10b981" font-family="'Inter', sans-serif" font-size="20" font-weight="700">89.2%</text>

  <!-- Diagram: Logistics Flow & Depot Nodes -->
  <rect x="30" y="180" width="740" height="285" rx="8" fill="#1a263c" stroke="#283955" stroke-width="1"/>
  <text x="50" y="210" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Supply Chain Pipeline &amp; Distribution Routing</text>
  
  <!-- Central Depot / Factory -->
  <rect x="60" y="260" width="160" height="130" rx="8" fill="#20304c" stroke="#3B82F6" stroke-width="2"/>
  <text x="140" y="295" fill="#75B8FF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">CENTRAL HUB</text>
  <text x="140" y="320" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Paragon Central Depot</text>
  <text x="140" y="350" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Inbound ERP Batch: OK</text>
  <rect x="85" y="360" width="110" height="18" rx="4" fill="#3B82F6" opacity="0.3"/>
  <text x="140" y="373" fill="#75B8FF" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">FIFO DISPATCH</text>

  <!-- Flow Arrows -->
  <line x1="220" y1="325" x2="310" y2="280" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="220" y1="325" x2="310" y2="370" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Regional Hub 1 -->
  <rect x="310" y="235" width="170" height="85" rx="6" fill="#1e293b" stroke="#283955" stroke-width="1"/>
  <text x="395" y="260" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">North Region Hub</text>
  <text x="395" y="280" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Lead: 1.2 Days</text>
  <text x="395" y="300" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Reorder Point: 450 Units</text>

  <!-- Regional Hub 2 -->
  <rect x="310" y="335" width="170" height="85" rx="6" fill="#1e293b" stroke="#283955" stroke-width="1"/>
  <text x="395" y="360" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">South Region Hub</text>
  <text x="395" y="380" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Lead: 1.8 Days</text>
  <text x="395" y="400" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Reorder Point: 620 Units</text>

  <!-- Outlets Final Nodes -->
  <line x1="480" y1="280" x2="570" y2="280" stroke="#75B8FF" stroke-width="2"/>
  <line x1="480" y1="375" x2="570" y2="375" stroke="#75B8FF" stroke-width="2"/>

  <rect x="570" y="240" width="170" height="80" rx="6" fill="#1e293b" stroke="#283955" stroke-width="1"/>
  <text x="655" y="265" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Retail Outlets Group A</text>
  <text x="655" y="285" fill="#75B8FF" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">POS Synchronization: Live</text>
  <text x="655" y="303" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Stock Out: 0%</text>

  <rect x="570" y="335" width="170" height="80" rx="6" fill="#1e293b" stroke="#283955" stroke-width="1"/>
  <text x="655" y="360" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Retail Outlets Group B</text>
  <text x="655" y="380" fill="#75B8FF" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Deposit Reconciled: Daily</text>
  <text x="655" y="398" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Variance: 0.00</text>
</svg>

